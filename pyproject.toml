[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isabelle-watchdog"
dynamic = ["version"]
description = "Isabelle build watchdog, and the build-trajectory corpus it records"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Andras Salamon" }]
keywords = ["isabelle", "theorem-proving", "build", "watchdog", "trajectory", "dataset"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Build Tools",
]

# No runtime dependencies, deliberately.  This runs beside a build, and
# anything it pulls in is something that can break one.  The only external
# tool it needs is `git`, which the projects it records already require.
dependencies = []

# A *test* dependency is not a runtime one: nothing under `tests/` is
# installed, imported by the package, or present when a build runs.  The
# no-dependencies rule protects the build; it is not a reason to hand-roll a
# test runner that every contributor then has to learn.
[project.optional-dependencies]
test = ["pytest>=7"]
# `isabelle-layout` is the extracted ROOT/theory-header parser (formerly
# `isabelle_query.common`).  It is what `roots.py` is checked *against*, never
# what it calls: a runtime dependency here would put an import between
# `isabelle-build` and a build, which is the failure the empty `dependencies`
# above exists to prevent.  It ships its conformance corpus as package data
# for exactly this arrangement.
#
# A separate extra rather than a line in `test` because it is not on PyPI yet,
# and an unresolvable requirement would break the documented `pip install -e
# ".[test]"` for everyone.  Fold it into `test` on publication; until then:
#
#     pip install ../isabelle-layout
#
# Without it `test_roots.py` skips the corpus checks and says so.
conformance = ["isabelle-layout>=0.1.0"]

[project.urls]
Homepage = "https://github.com/salamon/isabelle-watchdog"
Source = "https://github.com/salamon/isabelle-watchdog"

[project.scripts]
isabelle-watchdog = "isabelle_watchdog.watchdog:main"
isabelle-build = "isabelle_watchdog.build:main"
trajectory = "isabelle_watchdog.trajectory:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers: a typo in `@pytest.mark.isabele` would otherwise silently
# mark nothing, and `-m "not isabelle"` would then run the slow test anyway --
# the failure mode being guarded against is a marker that quietly does nothing.
addopts = "-ra --strict-markers"
markers = [
    "isabelle: needs a real Isabelle on PATH and a prebuilt HOL heap (~3 min)",
    "slow: takes seconds rather than milliseconds -- supervises a real child process",
]

[tool.hatch.version]
path = "src/isabelle_watchdog/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/isabelle_watchdog"]

[tool.hatch.build.targets.sdist]
# The design document is the reason half this code looks the way it does --
# the module comments cite it by section number -- so it ships with the
# source rather than living only in the repository.
include = ["src/", "docs/", "tests/", "README.md", "CHANGELOG.md", "LICENSE"]

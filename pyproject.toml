[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isabelle-watchdog"
dynamic = ["version"]
description = "Isabelle build watchdog, and the build-trajectory corpus it records"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Andras Salamon" }]
keywords = ["isabelle", "theorem-proving", "build", "watchdog", "trajectory", "dataset"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Build Tools",
]

# One runtime dependency, and the bar it had to clear is why there is only
# one.  This runs beside a build, so anything it pulls in is something that
# can break one; `isabelle-layout` itself declares no dependencies, so the
# transitive tree stays empty, and it is the ROOT parser rather than a tool
# that happens to contain one.  That distinction is the whole reason it was
# split out of `isabelle-query`, whose 11k lines and release cadence were
# what the no-dependencies rule was really refusing.
#
# `git` remains the other external requirement, and the projects this records
# already require it.
dependencies = ["isabelle-layout>=0.1.0"]

# A *test* dependency is not a runtime one: nothing under `tests/` is
# installed, imported by the package, or present when a build runs.  Keeping
# the runtime list short is the rule; it was never a reason to hand-roll a
# test runner that every contributor then has to learn.
[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ott2/isabelle-watchdog"
Source = "https://github.com/ott2/isabelle-watchdog"

[project.scripts]
isabelle-watchdog = "isabelle_watchdog.watchdog:main"
isabelle-build = "isabelle_watchdog.build:main"
trajectory = "isabelle_watchdog.trajectory:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers: a typo in `@pytest.mark.isabele` would otherwise silently
# mark nothing, and `-m "not isabelle"` would then run the slow test anyway --
# the failure mode being guarded against is a marker that quietly does nothing.
addopts = "-ra --strict-markers"
markers = [
    "isabelle: needs a real Isabelle on PATH and a prebuilt HOL heap (~3 min)",
    "slow: takes seconds rather than milliseconds -- supervises a real child process",
]

[tool.hatch.version]
path = "src/isabelle_watchdog/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/isabelle_watchdog"]

[tool.hatch.build.targets.sdist]
# The design document is the reason half this code looks the way it does --
# the module comments cite it by section number -- so it ships with the
# source rather than living only in the repository.
include = ["src/", "docs/", "tests/", "README.md", "CHANGELOG.md", "LICENSE"]
